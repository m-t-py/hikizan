<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ひきざんチャレンジ</title><link rel="stylesheet" href="style.css"></head><body><main class="app"><h1>🌸 ひきざんチャレンジ 🌸</h1><p id="progress" aria-live="polite"></p><div id="stars" aria-label="せいかいの数"></div><section class="card"><div id="question" class="math"></div><form id="answerForm"><label for="answer">こたえをいれてね</label><input id="answer" type="number" min="0" max="9" inputmode="numeric" pattern="[0-9]*" required autocomplete="off"><button id="submitButton" type="submit">こたえる！</button></form><div id="feedback" aria-live="polite"></div><button id="nextButton" type="button" hidden>つぎのもんだい →</button></section><div id="summary" hidden></div><button id="restartButton" type="button">🔄 もういちど</button></main><script src="script.js" defer></script></body></html>
